# Strict lint baseline: very_good_analysis (version pinned in pubspec.yaml).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - "**/*.g.dart"
    - lib/l10n/generated/**
    - third_party/**
    - android/**
    - ios/**
  errors:
    public_member_api_docs: error

linter:
  rules:
    # Lines are wrapped by `dart format`; long string/comment lines are allowed
    # so documentation can stay readable.
    lines_longer_than_80_chars: false
    # Keep the familiar `ClassName(...)` constructor syntax for readability.
    unnecessary_type_name_in_constructor: false
